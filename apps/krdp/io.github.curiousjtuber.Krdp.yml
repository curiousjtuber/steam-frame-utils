# KDE's krdpserver (KRdp, Plasma's Remote Desktop) as a flatpak for the Steam Frame: serves a
# Plasma desktop running on the Frame over RDP. SteamOS has no krdp, and anything built against
# its Plasma breaks at the next SteamOS update, so it's built on KDE's runtime, with its own Qt,
# KF6, FreeRDP and kpipewire. Built and installed by apps/install-krdp.sh; run by bin/krdpd.
#
# It captures through KWin's own screencast and fake-input protocols (krdpserver --plasma), on a
# Wayland socket bin/krdpd names. KWin restricts those protocols to clients it trusts: a
# sandboxed client connecting through flatpak's Wayland socket (--socket=wayland) carries a
# security context with this app id, and KWin reads <app id>.desktop for the interfaces it may
# use. krdp's own desktop file lists them, so it's renamed to this app id and exported. No
# permission bypass in KWin is needed, so the stock desktop works as well as Frametop's.
#
# Pinned here on purpose (verified 2026-10-29):
# - krdp 6.8.2 and kpipewire 6.8.2, unpatched. Plasma 6.8 is the first with what the Frame
#   needed from this app: NLA logins against a SAM file of the users it's given, with FreeRDP
#   3.32's extended security off (6.7.5 compared the password in onPostConnect, which FreeRDP
#   3.32 clients such as krdc 26.08 leave empty; krdp-6.7.5-2 carried 6.8's commits as a patch),
#   and kpipewire's cursor copy sized by stride * height, not four times that (6.7.5 read past
#   the cursor bitmap and segfaulted on the 256 px cursor SteamOS's gamescope sets; upstream
#   https://invent.kde.org/plasma/kpipewire/-/merge_requests/285).
# - libei 1.6.0: krdp 6.8 links libei for its portal session (EiConnection), unconditionally,
#   and the KDE 6.11 runtime has no libei. Only libei.so is built: --plasma never opens an EIS
#   connection, and liboeffis would pull in the portal plumbing for nothing. Its protocol code
#   generator needs the jinja2 Python module, which the SDK lacks, so a build-only module
#   installs the wheel and is cleaned out of the app; markupsafe, jinja2's one dependency, the
#   SDK has.
app-id: io.github.curiousjtuber.Krdp
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: krdpserver
rename-desktop-file: org.kde.krdpserver.desktop
finish-args:
  - --share=network          # the RDP port
  - --share=ipc
  - --device=dri
  - --socket=wayland         # the compositor WAYLAND_DISPLAY names when it starts, with a security context
  - --filesystem=xdg-run/pipewire-0 # the host's PipeWire, which the nested desktop shares
  - --filesystem=~/.config/krdpd:ro   # the TLS certificate and key (by absolute path: a nested
                                      # session may point XDG_CONFIG_HOME elsewhere)
  - --env=QT_QPA_PLATFORM=wayland
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - '*.la'
modules:
  - name: plasma-wayland-protocols
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://download.kde.org/stable/plasma-wayland-protocols/plasma-wayland-protocols-1.19.0.tar.xz
        sha256: 45679fe7a63c414f2c81793a62528fae6ccee584b6965719d7f9fc6dd48ba846

  - name: freerdp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TESTING=OFF
      - -DWITH_SERVER=ON
      - -DWITH_CLIENT=OFF
      - -DWITH_CLIENT_SDL=OFF
      - -DWITH_CLIENT_SDL2=OFF
      - -DWITH_CLIENT_SDL3=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_SHADOW=OFF
      - -DWITH_PROXY=OFF
      - -DWITH_PLATFORM_SERVER=OFF
      - -DWITH_X11=OFF
      - -DWITH_WAYLAND=OFF
      - -DWITH_CUPS=OFF
      - -DWITH_PULSE=OFF
      - -DWITH_FFMPEG=ON
      - -DWITH_DSP_FFMPEG=ON
      - -DWITH_SWSCALE=ON
      - -DWITH_VAAPI=OFF
      - -DWITH_PCSC=OFF
      - -DWITH_PKCS11=OFF
      - -DWITH_KRB5=OFF
      - -DWITH_FUSE=OFF
      - -DWITH_MANPAGES=OFF
      - -DWITH_WEBVIEW=OFF
      - -DCHANNEL_URBDRC=OFF
    sources:
      - type: archive
        url: https://github.com/FreeRDP/FreeRDP/archive/refs/tags/3.32.1.tar.gz
        sha256: 8803dd26ec9660550252f255cf2d672a785ddd8f544bb475834993e96807c87f

  - name: kpipewire
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://download.kde.org/stable/plasma/6.8.2/kpipewire-6.8.2.tar.xz
        sha256: 80d5bb3a95018f67f7476570ac8aad91872188cf2e6536cf81e9347b4adfefec

  - name: qtkeychain
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=/app/lib
      - -DLIB_INSTALL_DIR=/app/lib
      - -DBUILD_TRANSLATIONS=NO
      - -DBUILD_WITH_QT6=ON
    sources:
      - type: archive
        url: https://github.com/frankosterfeld/qtkeychain/archive/0.15.0.tar.gz
        sha256: f4254dc8f0933b06d90672d683eab08ef770acd8336e44dfa030ce041dc2ca22

  - name: kirigami-addons
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://download.kde.org/stable/kirigami-addons/kirigami-addons-1.15.0.tar.xz
        sha256: 82436c7589cdab2e2ee6b2e7d5ab3bedfa049fa7ded5498c01a90a04b9cdbbb3

  - name: linux-pam
    buildsystem: meson
    config-opts:
      - -Ddocs=disabled
      - -Dexamples=false
      - -Dxtests=false
      - -Daudit=disabled
      - -Dselinux=disabled
      - -Deconf=disabled
      - -Dnis=disabled
      - -Dpam_userdb=disabled
      - -Dvendordir=          # else its config goes to /usr/share/pam, read-only here
    sources:
      - type: archive
        url: https://github.com/linux-pam/linux-pam/releases/download/v1.7.3/Linux-PAM-1.7.3.tar.xz
        sha256: 2ce4765fd49df6693771ef2941f81e33d8ee14b94a81a5c7b369aa3b137b85a5

  - name: python3-jinja2
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} jinja2
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/62/a1/3d680cbfd5f4b8f15abc1d571870c5fc3e594bb582bc3b64ea099db13e56/jinja2-3.1.6-py3-none-any.whl
        sha256: 85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67

  - name: libei
    buildsystem: meson
    config-opts:
      - -Dlibei=enabled
      - -Dlibeis=disabled
      - -Dliboeffis=disabled
      - -Dtests=disabled
      - -Ddocumentation=[]
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/libinput/libei/-/archive/1.6.0/libei-1.6.0.tar.gz
        sha256: 81b4b967f0e5938492434a04f7ea2e6c6d96d3e6c44700bc691821f82281e602

  - name: krdp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_PLASMA_SESSION=ON
    sources:
      - type: archive
        url: https://download.kde.org/stable/plasma/6.8.2/krdp-6.8.2.tar.xz
        sha256: d4e651aca79f83d6da71de1b36e87d38b123fa8fcf066c2294a55a43b3675de4
